name: Update place data

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_data.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download OpenStreetMap and All the Places data
        run: python3 scripts/update_data.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm_snapshot.js data/chain_hours.js data/hours_todo.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update place data $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
