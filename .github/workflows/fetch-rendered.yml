name: Read opening hours with a browser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/fetch_list.json"
      - "scripts/fetch_rendered.py"
      - ".github/workflows/fetch-rendered.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Read websites
        run: python3 scripts/fetch_rendered.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/rendered.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Read opening hours with a browser $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
